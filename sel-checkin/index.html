<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEL Check-in 導航員 ｜ 鹿場國小教師工作坊（Mindset · Skillset · Toolset · 3 小時）</title>
<meta name="description" content="辰光國小 陳彥揚校長 · SEL Check-in 三小時教師工作坊：狀態先於內容、四大膠囊、COMBO 組合技、兩個分組小遊戲。">
<link rel="stylesheet" href="assets/style.css">
<style>
/* ===== 簡報骨架 ===== */
.topbar{position:fixed;inset:0 0 auto 0;height:52px;z-index:60;display:flex;align-items:center;
  gap:10px;padding:0 14px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.bar-title{font-weight:800;font-size:.82rem;letter-spacing:.02em;color:var(--ink2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.bar-title b{color:var(--dawn)}
.spacer{flex:1}
.chip{font-size:.76rem;font-weight:800;padding:.32em .7em;border-radius:999px;background:#eef3f9;
  color:var(--ink2);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.chip.live{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.warn{background:#fdece7;color:var(--relate-d);border-color:#f6c9bc}
.progress{position:fixed;top:52px;left:0;height:3px;background:linear-gradient(90deg,var(--energy),var(--relate),var(--mindful));
  z-index:61;transition:width .25s ease;border-radius:0 3px 3px 0}
.deck{padding-top:52px}
.slide{display:none;padding:clamp(18px,3.2vh,40px) 0 110px;animation:fade .32s ease both}
.slide.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;gap:10px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(238,242,247,.97) 55%,rgba(238,242,247,0));}
.nav-b{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  font:inherit;font-weight:800;font-size:.85rem;border-radius:999px;padding:.55em 1.1em;box-shadow:var(--sh)}
.nav-b:disabled{opacity:.35;cursor:default}
.pageno{font-size:.8rem;font-weight:800;color:var(--muted);min-width:70px;text-align:center}

/* ===== 版面元件 ===== */
.eyebrow{font-size:.74rem;font-weight:900;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:.5em}
.h-slide{font-size:clamp(1.5rem,2.6vw + .5rem,2.5rem);font-weight:900;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.94em;margin-top:.35em;max-width:70ch}
.rule{height:4px;width:64px;border-radius:99px;background:var(--dawn);margin:.9em 0 1.1em}
.lead{font-size:1.06em;color:var(--ink2)}
.kicker{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap;margin-bottom:.2em}
.note{margin-top:clamp(14px,2vh,22px);background:#fff;border-left:5px solid var(--dawn);
  border-radius:0 14px 14px 0;padding:.85em 1.1em;box-shadow:var(--sh);font-size:.94em;color:var(--ink2)}
.note.blue{border-left-color:var(--mindful)} .note.green{border-left-color:var(--reflect)}
.note b{color:var(--ink)}
.cap{font-size:.78em;color:var(--muted);margin-top:.5em;text-align:center}

/* 色卡 */
.qc{border-radius:var(--r);padding:clamp(14px,1.8vw,22px);box-shadow:var(--sh);background:#fff;
  border-top:6px solid var(--line);position:relative;overflow:hidden}
.qc h4{font-size:1.05em;margin-bottom:.35em;display:flex;align-items:center;gap:.45em}
.qc .ico{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.85em;flex:none}
.qc p{font-size:.9em;color:var(--ink2);margin:0 0 .4em}
.qc .use{font-size:.82em;font-weight:700;border-radius:10px;padding:.45em .7em;margin-top:.55em}
.qc.energy{border-top-color:var(--energy)} .qc.energy .ico{background:var(--energy)} .qc.energy .use{background:#fdf3e0;color:var(--energy-d)}
.qc.mindful{border-top-color:var(--mindful)} .qc.mindful .ico{background:var(--mindful)} .qc.mindful .use{background:#e7eff8;color:var(--mindful-d)}
.qc.reflect{border-top-color:var(--reflect)} .qc.reflect .ico{background:var(--reflect)} .qc.reflect .use{background:#e4f6ee;color:var(--reflect-d)}
.qc.relate{border-top-color:var(--relate)} .qc.relate .ico{background:var(--relate)} .qc.relate .use{background:#fdece7;color:var(--relate-d)}

/* 步驟 */
.steps{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.steps{grid-template-columns:1fr}}
.step{background:#fff;border-radius:var(--r);padding:1em 1.05em;box-shadow:var(--sh);position:relative}
.step .n{font-size:.72rem;font-weight:900;letter-spacing:.1em;color:#fff;background:var(--ink);
  border-radius:999px;padding:.15em .7em;display:inline-block;margin-bottom:.5em}
.step h4{font-size:1em;margin-bottom:.3em}
.step p{font-size:.86em;color:var(--ink2);margin:0}
.step .say{margin-top:.5em;font-size:.84em;background:#f2f6fa;border-radius:10px;padding:.45em .65em;color:var(--mindful-d);font-weight:600}

/* 顏色 check-in */
.colors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.6vw,18px)}
@media(max-width:720px){.colors{grid-template-columns:repeat(2,1fr)}}
.col{border-radius:var(--r);padding:clamp(14px,2vw,24px);color:#fff;text-align:center;box-shadow:var(--sh-lg)}
.col .e{font-size:clamp(2rem,4vw,3rem);line-height:1}
.col h4{font-size:1.15em;margin:.25em 0 .1em}
.col small{opacity:.92;font-size:.84em;display:block;line-height:1.45}
.col.r{background:linear-gradient(150deg,#ef6a5e,#d8433a)}
.col.y{background:linear-gradient(150deg,#f4bc55,#dd9614)}
.col.b{background:linear-gradient(150deg,#5a94cf,#255f9d)}
.col.g{background:linear-gradient(150deg,#63c9a2,#2f9a72)}

/* 時間軸 */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;margin-bottom:.85em}
.tl-i:before{content:"";position:absolute;left:-22px;top:.55em;width:11px;height:11px;border-radius:50%;
  background:#fff;border:3px solid var(--dawn)}
.tl-i b{display:block;font-size:.95em}
.tl-i span{font-size:.86em;color:var(--muted)}

/* 大 QR 頁 */
.qrpage{display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,3vw,44px);align-items:center}
@media(max-width:820px){.qrpage{grid-template-columns:1fr}}
.qrbox{background:#fff;padding:clamp(14px,2vw,22px);border-radius:22px;box-shadow:var(--sh-lg);display:grid;place-items:center;gap:10px}
.qrbox .u{font-size:.78rem;font-weight:800;color:var(--muted);word-break:break-all;text-align:center;max-width:280px}
.qrbox a.go{font-size:.82rem;font-weight:800;text-decoration:none;background:var(--ink);color:#fff;
  padding:.5em 1.2em;border-radius:999px}
.bul{margin:0;padding-left:1.15em}
.bul li{margin-bottom:.4em;font-size:.94em;color:var(--ink2)}
.bul li b{color:var(--ink)}

/* 分隔頁 */
.divider{min-height:62vh;display:grid;place-content:center;text-align:center}
.divider .num{font-size:clamp(4rem,12vw,9rem);font-weight:900;color:#fff;
  text-shadow:0 6px 30px rgba(24,34,48,.14);letter-spacing:-.04em;line-height:.9}
.divider h2{font-size:clamp(1.8rem,4vw,3.2rem);font-weight:900;margin:.1em 0 .2em}
.divider p{color:var(--muted);max-width:60ch;margin:0 auto}
.divider .time{margin-top:1.2em;font-weight:800;color:var(--ink2);font-size:.95em}

/* 目錄 */
.menu{position:fixed;inset:0;z-index:80;background:rgba(20,30,44,.55);backdrop-filter:blur(6px);display:none}
.menu.on{display:block}
.menu-in{position:absolute;inset:auto 0 0 0;max-height:82vh;overflow:auto;background:var(--bg2);
  border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.menu-in h3{font-size:1rem;margin-bottom:.7em}
.mrow{display:flex;gap:.6em;align-items:baseline;padding:.5em .6em;border-radius:10px;cursor:pointer;font-size:.9em}
.mrow:hover{background:#e8eef6}
.mrow.cur{background:var(--ink);color:#fff}
.mrow .mi{font-size:.75em;font-weight:900;color:var(--muted);min-width:2.2em}
.mrow.cur .mi{color:#cbd6e3}
.mrow .mt{font-size:.72em;color:var(--muted);margin-left:auto;white-space:nowrap}
.mrow.cur .mt{color:#cbd6e3}
.mrow.sec{font-weight:900;background:#e3eaf3}
.mrow.sec.cur{background:var(--ink)}
.print-hide{}
@media print{.topbar,.navbar,.progress,.menu{display:none!important}.slide{display:block!important;page-break-after:always}}
</style>
</head>
<body>

<div class="topbar">
  <div class="bar-title">SEL <b>CHECK-IN</b> 導航員 · Mindset ▸ Skillset ▸ Toolset</div>
  <div class="spacer"></div>
  <div class="chip" id="clock" title="點一下開始／暫停 3 小時計時">⏱ 00:00</div>
  <div class="chip" id="segchip" title="目前段落">開場</div>
  <div class="chip" id="menubtn">目錄</div>
</div>
<div class="progress" id="prog" style="width:0"></div>

<main class="deck" id="deck"></main>

<div class="navbar">
  <button class="nav-b" id="prev">◀ 上一頁</button>
  <div class="pageno" id="pageno">1 / 1</div>
  <button class="nav-b" id="next">下一頁 ▶</button>
  <div class="spacer"></div>
  <button class="nav-b" id="fs">⛶ 全螢幕</button>
</div>

<div class="menu" id="menu"><div class="menu-in"><h3>投影目錄 · 點選跳頁</h3><div id="mlist"></div></div></div>

<script src="assets/qr.js"></script>
<script src="assets/slides.js"></script>
<script>
(function(){
  var deck=document.getElementById('deck'), i=0, N=0;
  // 產生所有投影片
  deck.innerHTML = SLIDES.map(function(s,k){
    return '<section class="slide" data-i="'+k+'"><div class="wrap">'+s.html+'</div></section>';
  }).join('');
  var els=[].slice.call(deck.querySelectorAll('.slide')); N=els.length;

  // 目錄
  document.getElementById('mlist').innerHTML = SLIDES.map(function(s,k){
    return '<div class="mrow'+(s.sec?' sec':'')+'" data-k="'+k+'"><span class="mi">'+(k+1)+'</span><span>'+s.t+'</span><span class="mt">'+(s.time||'')+'</span></div>';
  }).join('');

  function show(k,push){
    k=Math.max(0,Math.min(N-1,k)); i=k;
    els.forEach(function(e,n){e.classList.toggle('on',n===k);});
    document.getElementById('pageno').textContent=(k+1)+' / '+N;
    document.getElementById('prog').style.width=((k+1)/N*100)+'%';
    document.getElementById('prev').disabled=(k===0);
    document.getElementById('next').disabled=(k===N-1);
    document.getElementById('segchip').textContent=SLIDES[k].part||'—';
    [].forEach.call(document.querySelectorAll('.mrow'),function(r){r.classList.toggle('cur',+r.dataset.k===k);});
    window.scrollTo(0,0);
    if(push!==false) history.replaceState(null,'','#s'+(k+1));
    // lazy QR
    var box=els[k].querySelector('[data-qr]');
    if(box && !box.dataset.done){ drawQR(box); }
  }
  function baseURL(){
    var u=location.href.split('#')[0];
    return u.replace(/[^/]*$/,'');
  }
  function drawQR(box){
    var target=box.dataset.qr;
    var url = /^https?:/.test(target) ? target : baseURL()+target;
    var holder=box.querySelector('.qrimg');
    QR.render(holder,url,{size:Math.min(300, Math.max(190, window.innerWidth*0.42))});
    var u=box.querySelector('.u'); if(u) u.textContent=url.replace(/^https?:\/\//,'');
    var a=box.querySelector('a.go'); if(a) a.href=url;
    box.dataset.done='1';
  }
  document.getElementById('prev').onclick=function(){show(i-1);};
  document.getElementById('next').onclick=function(){show(i+1);};
  document.getElementById('menubtn').onclick=function(){document.getElementById('menu').classList.add('on');};
  document.getElementById('menu').onclick=function(e){
    var r=e.target.closest('.mrow');
    if(r){show(+r.dataset.k);}
    if(r||e.target.id==='menu') document.getElementById('menu').classList.remove('on');
  };
  document.getElementById('fs').onclick=function(){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
  };
  document.addEventListener('keydown',function(e){
    if(e.target.matches('input,textarea')) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){show(i+1);e.preventDefault();}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){show(i-1);e.preventDefault();}
    if(e.key==='Home')show(0); if(e.key==='End')show(N-1);
    if(e.key==='m'||e.key==='M')document.getElementById('menu').classList.toggle('on');
  });
  var sx=0,sy=0;
  document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.7){ show(dx<0?i+1:i-1); }
  },{passive:true});

  // 計時器
  var t0=null, acc=0, tick=null;
  function fmt(ms){var s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  var clock=document.getElementById('clock');
  clock.onclick=function(){
    if(tick){clearInterval(tick);tick=null;acc+=Date.now()-t0;clock.classList.remove('live');}
    else{t0=Date.now();clock.classList.add('live');
      tick=setInterval(function(){
        var ms=acc+(Date.now()-t0); clock.textContent='⏱ '+fmt(ms);
        clock.classList.toggle('warn', ms>180*60*1000);
      },1000);}
  };
  clock.ondblclick=function(){acc=0;t0=Date.now();clock.textContent='⏱ 00:00';};

  var h=(location.hash.match(/#s(\d+)/)||[])[1];
  show(h?(+h-1):0,false);
})();
</script>
</body>
</html>
